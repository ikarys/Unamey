[package]
name = "studio"
version = "0.1.0"
license = "AGPL-3.0-only"
authors = ["Ikarys <bikarys@proton.me>"]
edition = "2024"

[dependencies]
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
llm-providers-connector = "0.3.0"

axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
url = "2"
getrandom = "0.2"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
rango-orm = { git = "https://github.com/ikarys/rango-orm", tag = "v0.1.1", features = ["postgres", "sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "uuid", "chrono", "json", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
